[project]
name = "backend"
version = "0.1.0"
description = "Expert Comptable - API monolithique modulaire FastAPI + SQLAlchemy"
readme = "README.md"
authors = [
    { name = "Abdoul-Gafar AMADOU", email = "abdoulgafaramadou938@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg2-binary",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "python-multipart",
    "pyjwt",
    "pwdlib[argon2]",
    "email-validator",
    "slowapi",
    "alembic",
    "redis",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[tool.uv]
# L'app est un module plat (app/main.py) lance par uvicorn, pas un package
# installable : uv sync ne doit installer que les dependances.
package = false

[tool.pytest.ini_options]
# Ouvre le sys.path sur la racine du projet (sinon `pytest`/`uv run pytest`
# sans `-m` echoue sur `import app` car `uv run` n'ajoute pas le cwd au path ;
# `python -m pytest` passe grace au sys.path[0] = cwd de `python -m`).
pythonpath = ["."]

# Requis par le CLI fastapi (utilise par FastAPI Cloud) pour localiser l'app
# dans notre layout plat.
[tool.fastapi]
entrypoint = "app.main:app"
