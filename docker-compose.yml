# Stack complete : db (Postgres) + redis + backend (FastAPI) + frontend
# (serveur de dev Vite avec hot-reload). Interpolation des variables par
# docker compose pour l'interpolation ${...}.

x-backend-env: &backend-env
  # Seuls les parametres proprement "docker" sont declares ici : le reste de la
  # config (SECRET_KEY, SUPER_USER_*, ASSISTANT_LLM_*, CORS, DEBUG, ENVIRONMENT)
  # vient de exp-cmp-api/.env, source unique de verite des parametres applicatifs,
  # injectes dans le service backend via env_file (voir service "backend").
  # Le root .env (racine) ne sert donc plus qu'a l'infra compose (POSTGRES_*).
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  ASSISTANTV2_REDIS_URL: redis://redis:6379/0

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requis dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requis dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: exp-cmp-backend
    build: ./exp-cmp-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./exp-cmp-api/.env
    environment: *backend-env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./exp-cmp-client
      dockerfile: Dockerfile
    container_name: exp_comp_frontend
    command: pnpm run dev
    volumes:
      # Montage des sources locales pour le Hot-Reload (live changes)
      - ./exp-cmp-client:/app
      # Volume dédié pour préserver les node_modules Linux installés dans le conteneur
      - client_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:8000/api"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
        
volumes:
  pgdata:
  redisdata:
  client_node_modules: